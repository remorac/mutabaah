{{define "content"}}
<div class="min-h-[80vh] flex items-center justify-center relative overflow-hidden">
  <div class="absolute inset-0 pointer-events-none">
    <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full opacity-30 blur-3xl" style="background: color-mix(in oklab, var(--color-primary) 20%, transparent);"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full opacity-20 blur-3xl" style="background: color-mix(in oklab, var(--color-secondary) 20%, transparent);"></div>
  </div>

  <div class="relative w-full max-w-md px-4">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-primary text-primary-content shadow-lg mb-4">
        <i data-lucide="shield-check" class="w-8 h-8"></i>
      </div>
      <h1 class="text-2xl font-bold tracking-tight">Choose a new password</h1>
      <p class="text-sm opacity-60 mt-1">Mutaba'ah Tracker</p>
    </div>

    <div class="card bg-base-100 shadow-xl border border-base-300/50">
      <div class="card-body gap-5 p-6 sm:p-8">
        <div class="flex items-center gap-2">
          <i data-lucide="lock-keyhole" class="w-5 h-5 text-primary"></i>
          <h2 class="card-title text-lg">Reset password</h2>
        </div>

        {{if .Invalid}}
        <div role="alert" class="alert alert-error">
          <i data-lucide="alert-triangle" class="w-4 h-4 shrink-0"></i>
          <span class="text-sm">This reset link is invalid or has expired.</span>
        </div>
        <a href="/forgot-password" class="btn btn-primary w-full">Request a new link</a>
        {{else}}
        <form method="POST" action="/reset-password" class="flex flex-col gap-4">
          {{if .CSRFToken}}<input type="hidden" name="_csrf" value="{{.CSRFToken}}" />{{end}}
          <input type="hidden" name="token" value="{{.Token}}" />
          <label class="block">
            <span class="label-text font-medium block mb-2">New password</span>
            <input type="password" name="new_password" required minlength="8" autocomplete="new-password"
                   class="input input-bordered w-full transition-all focus:ring-2 focus:ring-primary/20 {{if index .Errors "new_password"}}input-error{{end}}" />
            {{with index .Errors "new_password"}}<span class="text-error text-xs mt-1">{{.}}</span>{{end}}
          </label>
          <label class="block">
            <span class="label-text font-medium block mb-2">Confirm new password</span>
            <input type="password" name="confirm_password" required minlength="8" autocomplete="new-password"
                   class="input input-bordered w-full transition-all focus:ring-2 focus:ring-primary/20 {{if index .Errors "confirm_password"}}input-error{{end}}" />
            {{with index .Errors "confirm_password"}}<span class="text-error text-xs mt-1">{{.}}</span>{{end}}
          </label>
          <button type="submit" class="btn btn-primary mt-1 w-full shadow-sm hover:shadow-md transition-shadow">
            Update password
          </button>
        </form>
        {{end}}
        <div class="text-center">
          <a href="/login" class="link link-primary text-sm font-medium">Back to sign in</a>
        </div>
      </div>
    </div>
  </div>
</div>
<script>if (window.lucide) window.lucide.createIcons();</script>
{{end}}

{{define "content"}}
<div class="min-h-[60vh] flex items-center justify-center">
  <div class="max-w-md w-full px-4">
    <div class="card bg-base-100 shadow-xl border border-base-200">
      <div class="card-body items-center text-center gap-4 py-10">
        <div class="w-20 h-20 rounded-2xl bg-{{.Tone}}/10 text-{{.Tone}} grid place-items-center mb-2">
          <i data-lucide="{{.Icon}}" class="w-10 h-10"></i>
        </div>
        <div class="text-6xl font-extrabold opacity-10 leading-none">{{.Code}}</div>
        <h1 class="text-xl font-bold">{{.Heading}}</h1>
        <p class="opacity-70 text-sm max-w-xs">{{.Message}}</p>
        <div class="card-actions pt-2">
          <a href="/" class="btn btn-primary btn-sm shadow-sm">
            <i data-lucide="home" class="w-4 h-4"></i>
            Back to dashboard
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
<script>if (window.lucide) window.lucide.createIcons();</script>
{{end}}

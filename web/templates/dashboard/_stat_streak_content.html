{{define "_stat_streak_content.html"}}
<div id="stat-streak-content" data-swap-target="#stat-streak-content" class="card-body p-4">
  <div class="flex items-center justify-between">
    <div class="text-xs font-semibold uppercase tracking-wide opacity-50">Streak</div>
    <div class="w-8 h-8 rounded-lg bg-accent/10 text-accent grid place-items-center">
      <i data-lucide="flame" class="w-4 h-4"></i>
    </div>
  </div>
  <div class="mt-2">
    <div class="text-2xl font-bold leading-none">{{.Stats.Streak}}</div>
    <div class="text-xs opacity-60 mt-1">day{{if ne .Stats.Streak 1}}s{{end}} on track</div>
  </div>
</div>
{{end}}

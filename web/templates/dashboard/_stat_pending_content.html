{{define "_stat_pending_content.html"}}
<div id="stat-pending-content" data-swap-target="#stat-pending-content" class="card-body p-4">
  <div class="flex items-center justify-between">
    <div class="text-xs font-semibold uppercase tracking-wide opacity-50">Pending</div>
    <div class="w-8 h-8 rounded-lg bg-warning/10 text-warning grid place-items-center">
      <i data-lucide="clock" class="w-4 h-4"></i>
    </div>
  </div>
  <div class="mt-2">
    <div class="text-2xl font-bold leading-none">{{.Stats.PendingCount}}</div>
    <div class="text-xs opacity-60 mt-1">tasks remaining</div>
  </div>
</div>
{{end}}

{{define "_dashboard_stats.html"}}
<div id="dashboard-stats" class="grid grid-cols-2 lg:grid-cols-4 gap-3">
  <div class="card bg-base-100 shadow-sm border border-base-200">
    {{template "_stat_today_content.html" .}}
  </div>

  <div class="card bg-base-100 shadow-sm border border-base-200">
    {{template "_stat_pending_content.html" .}}
  </div>

  <div class="card bg-base-100 shadow-sm border border-base-200">
    {{template "_stat_week_content.html" .}}
  </div>

  <div class="card bg-base-100 shadow-sm border border-base-200">
    {{template "_stat_streak_content.html" .}}
  </div>
</div>
{{end}}

{{define "_today_pending_content.html"}}
<div id="today-pending-content" data-swap-target="#today-pending-content" class="card-body">
  <h3 class="card-title text-sm uppercase tracking-wide opacity-70 font-semibold">
    Uncompleted
    <span class="badge badge-ghost badge-sm">{{len .TodayPending}}</span>
  </h3>
  {{if .TodayPending}}
    <ul class="flex flex-col mt-2">
      {{range .TodayPending}}{{template "_task_row.html" .}}{{end}}
    </ul>
  {{else}}
    <div class="flex flex-col items-center text-center py-6">
      <div class="w-12 h-12 rounded-xl bg-success/10 text-success grid place-items-center mb-2">
        <i data-lucide="check-circle-2" class="w-6 h-6"></i>
      </div>
      <p class="text-sm font-medium text-success">All done. Alhamdulillah.</p>
    </div>
  {{end}}
</div>
{{end}}

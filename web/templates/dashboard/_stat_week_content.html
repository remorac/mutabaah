{{define "_stat_week_content.html"}}
<div id="stat-week-content" data-swap-target="#stat-week-content" class="card-body p-4">
  <div class="flex items-center justify-between">
    <div class="text-xs font-semibold uppercase tracking-wide opacity-50">This Week</div>
    <div class="w-8 h-8 rounded-lg bg-success/10 text-success grid place-items-center">
      <i data-lucide="trending-up" class="w-4 h-4"></i>
    </div>
  </div>
  <div class="mt-2">
    <div class="text-2xl font-bold leading-none">{{.Stats.WeeklyPct}}%</div>
    <div class="text-xs opacity-60 mt-1">{{.Stats.WeeklyDone}}/{{.Stats.WeeklyTotal}} completed</div>
  </div>
  <div class="mt-2 h-1.5 rounded-full bg-base-200 overflow-hidden">
    <div class="h-full rounded-full bg-success transition-all duration-500" style="width: {{.Stats.WeeklyPct}}%"></div>
  </div>
</div>
{{end}}

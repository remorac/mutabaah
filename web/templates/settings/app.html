{{define "content"}}
<div class="max-w-2xl flex flex-col gap-5">

  <div class="flex items-center justify-between gap-3">
    <h1 class="text-2xl font-semibold flex items-center gap-2">
      <i data-lucide="settings" class="w-6 h-6 text-primary"></i>
      Settings
    </h1>
  </div>

  {{if .Errors}}
  <div role="alert" class="alert alert-error">
    <i data-lucide="alert-triangle" class="w-4 h-4 shrink-0"></i>
    <span class="text-sm">Please fix the errors below.</span>
  </div>
  {{end}}

  <form method="POST" action="{{.FormAction}}" class="card bg-base-100 shadow-sm border border-base-200">
    <div class="card-body flex flex-col gap-5">
      <input type="hidden" name="_csrf" value="{{.CSRFToken}}" />

      <label class="block">
        <span class="label-text font-medium block mb-2">Week start day</span>
        <select name="week_start_day" required
          class="select select-bordered w-full transition-all focus:ring-2 focus:ring-primary/20 {{if index .Errors "week_start_day"}}select-error{{end}}">
          {{range .WeekdayOptions}}
          <option value="{{.Value}}" {{if .Selected}}selected{{end}}>{{.Label}}</option>
          {{end}}
        </select>
        {{with index .Errors "week_start_day"}}<span class="text-error text-xs mt-1">{{.}}</span>{{end}}
      </label>

      <label class="block">
        <span class="label-text font-medium block mb-2">Missed/reset history</span>
        <select name="history_weeks" required
          class="select select-bordered w-full transition-all focus:ring-2 focus:ring-primary/20 {{if index .Errors "history_weeks"}}select-error{{end}}">
          {{range .HistoryOptions}}
          <option value="{{.Value}}" {{if .Selected}}selected{{end}}>{{.Label}}</option>
          {{end}}
        </select>
        {{with index .Errors "history_weeks"}}<span class="text-error text-xs mt-1">{{.}}</span>{{end}}
      </label>

      <div class="card-actions justify-end gap-2 pt-3 border-t border-base-200">
        <button type="submit" class="btn btn-primary btn-sm shadow-sm">
          <i data-lucide="save" class="w-4 h-4"></i>
          Save
        </button>
      </div>
    </div>
  </form>

</div>
<script>if (window.lucide) window.lucide.createIcons();</script>
{{end}}

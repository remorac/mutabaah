{{define "content"}}
<div class="flex flex-col gap-4">

  <div class="flex items-center justify-between flex-wrap gap-3">
    <h2 class="text-xl font-semibold flex items-center gap-2">
      <i data-lucide="calendar-days" class="w-5 h-5 text-primary"></i>
      {{.Grid.MonthLabel}}
    </h2>
    <div class="join shadow-sm rounded-sm">
      <a class="btn btn-sm join-item border-base-200 bg-base-100 hover:bg-base-200" href="/calendar?month={{.Grid.PrevMonth}}" aria-label="Previous month">
        <i data-lucide="chevron-left" class="w-4 h-4"></i>
      </a>
      <a class="btn btn-sm join-item border-base-200 bg-base-100 hover:bg-base-200" href="/calendar?month={{.Grid.TodayMonth}}">Today</a>
      <a class="btn btn-sm join-item border-base-200 bg-base-100 hover:bg-base-200" href="/calendar?month={{.Grid.NextMonth}}" aria-label="Next month">
        <i data-lucide="chevron-right" class="w-4 h-4"></i>
      </a>
    </div>
  </div>

  <div class="grid lg:grid-cols-[2fr_1fr] gap-4">

    <div class="card bg-base-100 shadow-sm border border-base-200">
      <div class="card-body p-4">
        <div class="grid grid-cols-7 gap-1 text-xs font-semibold opacity-50 mb-2">
          {{range .Grid.Weekdays}}<div class="text-center py-1">{{.}}</div>{{end}}
        </div>
        <div class="grid grid-cols-7 gap-1">
          {{range .Grid.Weeks}}{{range .}}
            <button
              type="button"
              class="aspect-square rounded-sm border border-base-200 p-1.5 text-left transition-all duration-150 hover:border-primary hover:shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-1 focus:ring-offset-base-100 {{if not .InMonth}}opacity-40{{end}} {{if .IsToday}}ring-2 ring-primary ring-offset-1 ring-offset-base-100 font-bold{{end}} {{if eq .Date $.Grid.Selected}}bg-primary/10 border-primary{{end}} {{.IntensityCls}}"
              hx-get="/calendar/day?date={{.Date}}"
              hx-target="#calendar-day-panel"
              hx-swap="innerHTML swap:150ms"
              aria-pressed="{{if eq .Date $.Grid.Selected}}true{{else}}false{{end}}">
              <div class="flex items-start justify-between h-full">
                <span class="text-xs font-semibold {{if .IsToday}}text-primary{{end}}">{{.DayNum}}</span>
                {{if gt .Total 0}}
                  <span class="text-[10px] font-medium {{if eq .Completed .Total}}text-success{{else}}opacity-70{{end}}">{{.Completed}}/{{.Total}}</span>
                {{end}}
              </div>
            </button>
          {{end}}{{end}}
        </div>

        <!-- Heatmap legend -->
        <div class="flex items-center gap-3 mt-4 pt-3 border-t border-base-200 text-xs opacity-60">
          <span>Less</span>
          <div class="flex gap-1">
            <div class="w-4 h-4 rounded bg-base-200 border border-base-300"></div>
            <div class="w-4 h-4 rounded bg-green-100 border border-green-200"></div>
            <div class="w-4 h-4 rounded bg-green-200 border border-green-300"></div>
            <div class="w-4 h-4 rounded bg-green-300 border border-green-400"></div>
            <div class="w-4 h-4 rounded bg-green-400 border border-green-500"></div>
            <div class="w-4 h-4 rounded bg-green-500 border border-green-600"></div>
          </div>
          <span>More</span>
        </div>
      </div>
    </div>

    <div id="calendar-day-panel" class="card bg-base-100 shadow-sm border border-base-200">
      {{template "_day.html" .Day}}
    </div>

  </div>
</div>
<script>if (window.lucide) window.lucide.createIcons();</script>
{{end}}

version: "2"
sql:
  - engine: "mysql"
    queries: "queries"
    schema: "migrations"
    gen:
      go:
        package: "repository"
        out: "../internal/repository"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
